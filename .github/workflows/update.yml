name: 決算予定日の更新

on:
  schedule:
    # 毎晩 21:17 JST（= 12:17 UTC）。日本株の大引け後の発表と、その日の朝に出た米国株の結果をまとめて反映する。
    # （GitHub の混雑で数分〜十数分遅れることがある。ちょうどの時刻を避けて 17 分にしている）
    - cron: "17 12 * * *"
  workflow_dispatch: {}   # Actions 画面から手動でも実行できる
  push:
    paths: ["scraper/**", "tests/**"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pytest
      - run: pytest -q

  update:
    needs: test
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: JavaScriptで表示するIRページ用のブラウザを入れる
        run: python -m playwright install --with-deps chromium
      - name: IRページから取得
        run: python -m scraper.update
      - name: 会社ごとのページとサイトマップを作る
        run: python -m scraper.pages
      - name: 変わっていたらコミット（GitHub Pages が自動で更新される）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/earnings.json docs/c docs/sitemap.xml
          git diff --cached --quiet || git commit -m "決算予定日を更新 $(date -u +%Y-%m-%d)"
          git push
