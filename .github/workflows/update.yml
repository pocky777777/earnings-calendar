name: 決算予定日の更新

on:
  schedule:
    # 毎月15日と28日の 06:00 JST（= 前日 21:00 UTC）。約2週間ごと。2月でも必ず2回動く。
    - cron: "0 21 14,27 * *"
  workflow_dispatch: {}   # Actions 画面から手動でも実行できる
  push:
    paths: ["scraper/**", "tests/**"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pytest
      - run: pytest -q

  update:
    needs: test
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: JavaScriptで表示するIRページ用のブラウザを入れる
        run: python -m playwright install --with-deps chromium
      - name: IRページから取得
        run: python -m scraper.update
      - name: 変わっていたらコミット（GitHub Pages が自動で更新される）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/earnings.json
          git diff --cached --quiet || git commit -m "決算予定日を更新 $(date -u +%Y-%m-%d)"
          git push
